<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automated Static Website Deployment</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div>
    <h1>🚀 Deployed via Terraform + GitHub Actions</h1>
    <p>Served from S3, delivered through CloudFront.</p>
    <p><code>git push</code> → Terraform apply → S3 sync → CloudFront invalidation</p>
  </div>
</body>
</html>
